name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: damienwen-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    # Build on the oldest supported VPS baseline so native runtime packages
    # remain compatible with Ubuntu 22.04 and newer x86_64 hosts.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        # v7.0.1; the full SHA is immutable.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # v7.0.0; the full SHA is immutable.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check deployment files
        run: bash ops/check-deployment-files.sh

      - name: Verify site
        run: npm run verify

      - name: Package standalone release
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full Git commit SHA." >&2
            exit 1
          fi

          test -f dist/standalone/server.js
          test -f dist/standalone/dist/server/index.js

          archive_name="${GITHUB_SHA}.tar.gz"
          release_dir="${RUNNER_TEMP}/release"
          tar_path="${release_dir}/${GITHUB_SHA}.tar"

          mkdir --parents "${release_dir}"

          # Normalize entry order, metadata, and the gzip header so rerunning
          # the same commit produces the same archive bytes.
          TZ=UTC LC_ALL=C tar \
            --sort=name \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --mtime="@0" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create \
            --file "${tar_path}" \
            --directory dist/standalone \
            .
          gzip --best --no-name "${tar_path}"

          (
            cd "${release_dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
          )

      - name: Upload tested release
        # v7.0.1; the full SHA is immutable.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/${{ github.sha }}.tar.gz
            ${{ runner.temp }}/release/${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy tested release
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: https://damienwen.dev

    steps:
      - name: Download tested release
        # v8.0.1; the full SHA is immutable.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: standalone-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Verify downloaded release
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full Git commit SHA." >&2
            exit 1
          fi

          archive_name="${GITHUB_SHA}.tar.gz"
          checksum_name="${archive_name}.sha256"
          release_dir="${RUNNER_TEMP}/release"

          expected_files="$(printf '%s\n%s\n' \
            "${archive_name}" \
            "${checksum_name}")"
          actual_files="$(
            find "${release_dir}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )"

          if [[ "${actual_files}" != "${expected_files}" ]]; then
            echo "Downloaded release contains unexpected files." >&2
            exit 1
          fi

          [[ -f "${release_dir}/${archive_name}" &&
            ! -L "${release_dir}/${archive_name}" ]]
          [[ -f "${release_dir}/${checksum_name}" &&
            ! -L "${release_dir}/${checksum_name}" ]]

          checksum_line="$(< "${release_dir}/${checksum_name}")"
          if [[ ! "${checksum_line}" =~ ^[0-9a-f]{64}[[:space:]]{2}${GITHUB_SHA}\.tar\.gz$ ]]; then
            echo "Release checksum file has an invalid format." >&2
            exit 1
          fi

          (
            cd "${release_dir}"
            sha256sum --check --strict "${checksum_name}"
          )

      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?Set the production DEPLOY_HOST secret.}"
          : "${DEPLOY_PORT:?Set the production DEPLOY_PORT secret.}"
          : "${DEPLOY_PRIVATE_KEY:?Set the production DEPLOY_SSH_KEY secret.}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the production DEPLOY_KNOWN_HOSTS secret.}"

          if [[ ! "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "DEPLOY_HOST must be a hostname or IPv4 address." >&2
            exit 1
          fi

          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]{1,5}$ ]] ||
            ((10#${DEPLOY_PORT} < 1 || 10#${DEPLOY_PORT} > 65535)); then
            echo "DEPLOY_PORT must be an integer from 1 to 65535." >&2
            exit 1
          fi

          deploy_key="${RUNNER_TEMP}/damienwen_deploy_key"
          known_hosts="${RUNNER_TEMP}/damienwen_known_hosts"
          ssh_config="${RUNNER_TEMP}/damienwen_ssh_config"

          printf '%s\n' "${DEPLOY_PRIVATE_KEY}" > "${deploy_key}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${known_hosts}"
          chmod 600 "${deploy_key}" "${known_hosts}"

          {
            printf 'Host damienwen-production\n'
            printf '  HostName %s\n' "${DEPLOY_HOST}"
            printf '  Port %s\n' "${DEPLOY_PORT}"
            printf '  User damienwen-deploy\n'
            printf '  IdentityFile %s\n' "${deploy_key}"
            printf '  UserKnownHostsFile %s\n' "${known_hosts}"
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  BatchMode yes\n'
            printf '  LogLevel ERROR\n'
          } > "${ssh_config}"
          chmod 600 "${ssh_config}"

      - name: Upload and activate release
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a full Git commit SHA." >&2
            exit 1
          fi

          archive_name="${GITHUB_SHA}.tar.gz"
          release_dir="${RUNNER_TEMP}/release"
          ssh_config="${RUNNER_TEMP}/damienwen_ssh_config"

          ssh -T -F "${ssh_config}" damienwen-production \
            "upload-archive ${GITHUB_SHA}" \
            < "${release_dir}/${archive_name}"

          ssh -T -F "${ssh_config}" damienwen-production \
            "upload-checksum ${GITHUB_SHA}" \
            < "${release_dir}/${archive_name}.sha256"

          ssh -T -F "${ssh_config}" damienwen-production \
            "deploy ${GITHUB_SHA}" \
            < /dev/null
